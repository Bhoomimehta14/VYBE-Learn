<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How VYBE Learn works"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><rect width="900" height="790" fill="#FFFFFF"/><text x="450" y="30" font-size="18" font-weight="700" fill="#222" text-anchor="middle">How VYBE Learn works, technically</text><text x="450" y="50" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Green = code that decides. Blue = AI that explains.</text><rect x="300" y="70" width="300" height="44" rx="8" fill="#F1ECE4" stroke="#7A6E5D" stroke-width="1.6"/><text x="450.0" y="97.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Learner uploads a CSV</text><line x1="450" y1="114" x2="450" y2="140" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="140" width="400" height="70" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="450.0" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">1. Cleaning agent</text><text x="450.0" y="180" text-anchor="middle" font-size="12" fill="#555555">observe → decide → act → evaluate → adapt</text><text x="450.0" y="195" text-anchor="middle" font-size="12" fill="#555555">repeats until each column passes its check</text><path d="M650,160 H685 V192 H652" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="695" y="172" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">fix failed:</text><text x="695" y="186" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">try next fix</text><line x1="450" y1="210" x2="450" y2="236" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="236" width="400" height="58" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="450.0" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">2. Verification agent</text><text x="450.0" y="276" text-anchor="middle" font-size="12" fill="#555555">can the cleaned data be grouped, charted, trended?</text><line x1="450" y1="294" x2="450" y2="320" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="320" width="400" height="70" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="450.0" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">3. Model-selection agent</text><text x="450.0" y="360" text-anchor="middle" font-size="12" fill="#555555">start simple, score with cross-validation,</text><text x="450.0" y="375" text-anchor="middle" font-size="12" fill="#555555">escalate only when a check fails</text><line x1="450" y1="390" x2="450" y2="416" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="416" width="400" height="58" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="450.0" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">4. Educator agent</text><text x="450.0" y="456" text-anchor="middle" font-size="12" fill="#555555">Gemini writes the explanation of each decision</text><text x="670" y="440" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">no key or quota?</text><text x="670" y="454" font-size="11.5" font-weight="400" fill="#555" text-anchor="start">plain template text</text><line x1="450" y1="474" x2="450" y2="500" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="500" width="300" height="44" rx="8" fill="#F1ECE4" stroke="#7A6E5D" stroke-width="1.6"/><text x="450.0" y="527.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Lessons shown to the learner</text><text x="450" y="580" font-size="15" font-weight="700" fill="#222" text-anchor="middle">Beside every lesson: the AI Mentor</text><rect x="30" y="600" width="190" height="58" rx="8" fill="#F1ECE4" stroke="#7A6E5D" stroke-width="1.6"/><text x="125.0" y="622" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Learner message</text><text x="125.0" y="640" text-anchor="middle" font-size="12" fill="#555555">+ role, experience, goal</text><line x1="220" y1="629" x2="250" y2="629" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="600" width="190" height="58" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="345.0" y="622" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Intent classifier</text><text x="345.0" y="640" text-anchor="middle" font-size="12" fill="#555555">transfer learning</text><line x1="440" y1="629" x2="470" y2="629" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="470" y="600" width="190" height="58" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="565.0" y="622" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Learner level</text><text x="565.0" y="640" text-anchor="middle" font-size="12" fill="#555555">guided/assisted/independent</text><line x1="660" y1="629" x2="690" y2="629" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="690" y="600" width="190" height="58" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="785.0" y="622" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Gemini</text><text x="785.0" y="640" text-anchor="middle" font-size="12" fill="#555555">grounded in the lesson</text><line x1="785" y1="658" x2="785" y2="690" stroke="#666" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="690" width="320" height="44" rx="8" fill="#F1ECE4" stroke="#7A6E5D" stroke-width="1.6"/><text x="720.0" y="717.0" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Reply + detected intent tag</text><text x="450" y="770" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Gemini unavailable → built-in tips, written in the learner&#x27;s own role voice.</text></svg>