<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Tree of agents"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><rect width="1120" height="600" fill="#FFFFFF"/><text x="560" y="30" font-size="18" font-weight="700" fill="#222" text-anchor="middle">The agents in VYBE Learn</text><text x="560" y="50" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">Rule: the AI never makes a data decision. Code decides, AI explains.</text><rect x="430" y="70" width="260" height="48" rx="8" fill="#2B2B2B" stroke="#2B2B2B" stroke-width="1.6"/><text x="560.0" y="99.0" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">VYBE Learn</text><line x1="560" y1="118" x2="560" y2="140" stroke="#888" stroke-width="1.5"/><line x1="180" y1="140" x2="940" y2="140" stroke="#888" stroke-width="1.5"/><line x1="180" y1="140" x2="180" y2="160" stroke="#888" stroke-width="1.5"/><line x1="560" y1="140" x2="560" y2="160" stroke="#888" stroke-width="1.5"/><line x1="940" y1="140" x2="940" y2="160" stroke="#888" stroke-width="1.5"/><rect x="40" y="160" width="280" height="54" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="180.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Data agents</text><text x="180.0" y="200" text-anchor="middle" font-size="12" fill="#555555">deterministic Python, no LLM</text><rect x="420" y="160" width="280" height="54" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="560.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Tutor agents</text><text x="560.0" y="200" text-anchor="middle" font-size="12" fill="#555555">Gemini + one small trained model</text><rect x="800" y="160" width="280" height="54" rx="8" fill="#FBEFD9" stroke="#B07A1E" stroke-width="1.6"/><text x="940.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Google ADK tutor</text><text x="940.0" y="200" text-anchor="middle" font-size="12" fill="#555555">optional, runs locally</text><line x1="180" y1="214" x2="180" y2="240" stroke="#888" stroke-width="1.5"/><rect x="45" y="240" width="270" height="72" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="180.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Cleaning agent</text><text x="180.0" y="280" text-anchor="middle" font-size="12" fill="#555555">finds problems, tries a fix, checks it,</text><text x="180.0" y="295" text-anchor="middle" font-size="12" fill="#555555">backtracks if it distorted the data</text><rect x="45" y="328" width="270" height="72" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="180.0" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Verification agent</text><text x="180.0" y="368" text-anchor="middle" font-size="12" fill="#555555">group-by, chart and trend checks</text><text x="180.0" y="383" text-anchor="middle" font-size="12" fill="#555555">on the cleaned data</text><rect x="45" y="416" width="270" height="72" rx="8" fill="#E3F1E8" stroke="#2F7D4F" stroke-width="1.6"/><text x="180.0" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Model-selection agent</text><text x="180.0" y="456" text-anchor="middle" font-size="12" fill="#555555">simplest model first, cross-validated,</text><text x="180.0" y="471" text-anchor="middle" font-size="12" fill="#555555">escalates only on a failed check</text><line x1="560" y1="214" x2="560" y2="240" stroke="#888" stroke-width="1.5"/><rect x="425" y="240" width="270" height="72" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="560.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Educator agent</text><text x="560.0" y="280" text-anchor="middle" font-size="12" fill="#555555">writes the plain-language explanation</text><text x="560.0" y="295" text-anchor="middle" font-size="12" fill="#555555">of each decision</text><rect x="425" y="328" width="270" height="58" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="560.0" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Mentor agent</text><text x="560.0" y="368" text-anchor="middle" font-size="12" fill="#555555">answers questions beside each lesson</text><rect x="425" y="402" width="270" height="72" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="560.0" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Intent classifier (mentor)</text><text x="560.0" y="442" text-anchor="middle" font-size="12" fill="#555555">transfer learning: frozen encoder + head</text><text x="560.0" y="457" text-anchor="middle" font-size="12" fill="#555555">(7 intents)</text><rect x="425" y="490" width="270" height="58" rx="8" fill="#E6EEFA" stroke="#3A63A8" stroke-width="1.6"/><text x="560.0" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Learner level (mentor)</text><text x="560.0" y="530" text-anchor="middle" font-size="12" fill="#555555">profile + mastery + hints used</text><line x1="940" y1="214" x2="940" y2="240" stroke="#888" stroke-width="1.5"/><rect x="805" y="240" width="270" height="58" rx="8" fill="#FBEFD9" stroke="#B07A1E" stroke-width="1.6"/><text x="940.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Root agent</text><text x="940.0" y="280" text-anchor="middle" font-size="12" fill="#555555">front door, 5 tools, Gemini</text><rect x="805" y="314" width="270" height="58" rx="8" fill="#FBEFD9" stroke="#B07A1E" stroke-width="1.6"/><text x="940.0" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Orchestrator</text><text x="940.0" y="354" text-anchor="middle" font-size="12" fill="#555555">routes each message to a specialist</text><rect x="805" y="388" width="270" height="87" rx="8" fill="#FBEFD9" stroke="#B07A1E" stroke-width="1.6"/><text x="940.0" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Specialists (9)</text><text x="940.0" y="428" text-anchor="middle" font-size="12" fill="#555555">Profiler · Data · Curriculum · Teacher</text><text x="940.0" y="443" text-anchor="middle" font-size="12" fill="#555555">Visualization · Quiz · Practice</text><text x="940.0" y="458" text-anchor="middle" font-size="12" fill="#555555">Evaluator · Gamification</text><text x="560" y="575" font-size="12.5" font-weight="400" fill="#555" text-anchor="middle">The mentor tries the ADK tutor first when it is running, then Gemini directly, then built-in tips.</text></svg>